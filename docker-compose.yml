version: '3.8'

services:
  app:
    build: .
    container_name: order_management_app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Nếu muốn kết nối với MySQL service bên dưới:
      # - SPRING_PROFILES_ACTIVE=mysql
      # - SPRING_DATASOURCE_URL=jdbc:mysql://mysql_db:3306/order_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      # - SPRING_DATASOURCE_USERNAME=root
      # - SPRING_DATASOURCE_PASSWORD=rootpassword
    volumes:
      - ./data:/app/data
    restart: unless-stopped

